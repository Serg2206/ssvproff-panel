
name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'panel/backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'panel/backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  test:
    name: Test Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('panel/backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        working-directory: panel/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Lint with pylint
        working-directory: panel/backend
        run: |
          pip install pylint
          pylint main.py services/*.py || true
      
      - name: Format check with black
        working-directory: panel/backend
        run: |
          pip install black
          black --check main.py services/*.py || true
      
      - name: Type check with mypy
        working-directory: panel/backend
        run: |
          pip install mypy
          mypy main.py || true
      
      - name: Start FastAPI server (health check)
        working-directory: panel/backend
        run: |
          # Создаём минимальный .env для тестирования
          echo "APP_PASSWORD=test_password" > .env
          echo "APP_SECRET=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> .env
          echo "RCLONE_REMOTE=test_remote" >> .env
          echo "ALLOWED_FLOWS_DIR=../../flows" >> .env
          
          # Запускаем сервер в фоне
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          
          # Ждём запуска сервера
          sleep 5
          
          # Проверяем, что сервер отвечает
          curl -f http://127.0.0.1:8000/docs || exit 1
          
          # Останавливаем сервер
          kill $SERVER_PID
      
      - name: Run tests (if exists)
        working-directory: panel/backend
        run: |
          if [ -f "test_*.py" ] || [ -d "tests" ]; then
            pip install pytest pytest-cov
            pytest --cov=. --cov-report=xml
          else
            echo "No tests found, skipping"
          fi
