
name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'panel/frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'panel/frontend/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  test:
    name: Test Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: ['18', '20']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: panel/frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('panel/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Install dependencies
        working-directory: panel/frontend
        run: npm ci
      
      - name: Lint code
        working-directory: panel/frontend
        run: npm run lint || true
      
      - name: Type check
        working-directory: panel/frontend
        run: npm run typecheck || true
      
      - name: Build project
        working-directory: panel/frontend
        run: npm run build
      
      - name: Check build artifacts
        working-directory: panel/frontend
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          echo "Build successful: dist directory created"
          ls -lah dist/
      
      - name: Run tests (if exists)
        working-directory: panel/frontend
        run: |
          if grep -q "\"test\":" package.json; then
            npm test
          else
            echo "No tests configured, skipping"
          fi
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build-node-${{ matrix.node-version }}
          path: panel/frontend/dist/
          retention-days: 7
